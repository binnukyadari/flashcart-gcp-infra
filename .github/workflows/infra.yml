name: infra

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'stacks/**'
      - 'modules/**'
      - 'policies/**'
      - '.github/workflows/**'
      - '.tflint.hcl'

permissions:
  contents: read

jobs:
  dev-plan:
    if: >-
      github.repository == 'binnukyadari/flashcart-gcp-infra' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'feat/flashcart-artifact-registry'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-stack.yml
