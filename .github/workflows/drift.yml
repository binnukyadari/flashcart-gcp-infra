# Drift scanning is paused during dev-only PR qualification.
# No schedule, cloud authentication, or reusable Terraform invocation.
name: drift (paused)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-24.04
    steps:
      - run: echo 'Drift scanning is paused. Only dev Artifact Registry PR planning is enabled.'
