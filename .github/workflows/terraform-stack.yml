name: terraform-stack

on:
  workflow_call: {}

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  STACK: stacks/03-application
  ENVIRONMENT: dev

jobs:
  plan:
    name: plan Artifact Registry (dev only)
    if: >-
      github.event_name == 'pull_request' &&
      github.repository == 'binnukyadari/flashcart-gcp-infra' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.base_ref == 'main' &&
      github.head_ref == 'feat/flashcart-artifact-registry'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: flashcart-artifact-registry-dev-plan
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check dev planning configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          PLAN_SA: ${{ vars.GCP_PLAN_SA }}
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
          STATE_PREFIX: ${{ vars.TF_STATE_PREFIX }}
        run: |
          set -euo pipefail
          test "$WIF_PROVIDER" = 'projects/586582398977/locations/global/workloadIdentityPools/flashcart-dev-pr/providers/github-pr'
          test "$PLAN_SA" = 'flashcart-dev-pr-plan@ritru-tf-seed-01.iam.gserviceaccount.com'
          test "$STATE_BUCKET" = 'ritru-tfstate-586582398977'
          test "$STATE_PREFIX" = 'gcp-02-flashcart'
          python3 - <<'PY'
          import pathlib, re
          text = pathlib.Path('stacks/03-application/env/dev.tfvars').read_text()
          for key, expected in [('project_id', 'ritru-fc-dev-01'), ('environment', 'dev')]:
              values = re.findall(rf'^\s*{key}\s*=\s*"([^"]+)"\s*$', text, re.M)
              assert values == [expected], f'Unexpected {key}: dev planning only'
          PY

      # This identity can read Artifact Registry and this stack's dev state only.
      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SA }}
          project_id: ritru-fc-dev-01

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.6'
          terraform_wrapper: false

      - name: terraform init
        working-directory: stacks/03-application
        env:
          STATE_BUCKET: ${{ vars.GCP_STATE_BUCKET }}
          STATE_PREFIX: ${{ vars.TF_STATE_PREFIX }}
        run: |
          set -euo pipefail
          terraform init -lockfile=readonly \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="prefix=$STATE_PREFIX/$STACK/$ENVIRONMENT"

      - name: fmt and validate
        working-directory: stacks/03-application
        run: |
          terraform fmt -check -recursive ../../modules/application-tier .
          terraform validate

      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4
        with:
          tflint_version: v0.59.1
      - name: tflint
        working-directory: stacks/03-application
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

      - name: terraform plan (read only, no state lock writes)
        working-directory: stacks/03-application
        run: |
          set +e
          terraform plan -var-file=env/dev.tfvars -out=tfplan -lock=false -detailed-exitcode
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
          terraform show -no-color tfplan > plan.txt
          terraform show -json tfplan > plan.json

      - name: conftest OPA policy check
        working-directory: stacks/03-application
        run: |
          set -euo pipefail
          release=https://github.com/open-policy-agent/conftest/releases/download/v0.56.0
          curl --fail --silent --show-error --location "$release/conftest_0.56.0_Linux_x86_64.tar.gz" -o conftest.tar.gz
          curl --fail --silent --show-error --location "$release/checksums.txt" -o checksums.txt
          grep ' conftest_0.56.0_Linux_x86_64.tar.gz$' checksums.txt | sha256sum --check --strict
          tar xzf conftest.tar.gz conftest
          ./conftest test plan.json --policy "$GITHUB_WORKSPACE/policies" --all-namespaces

      # Publish only allowlisted Artifact Registry fields; never raw plans/state.
      - name: Plan review summary
        working-directory: stacks/03-application
        run: |
          python3 - <<'PY'
          import json, os
          from collections import Counter
          plan = json.load(open('plan.json'))
          changes = plan.get('resource_changes', [])
          for r in changes:
              assert r['address'] == 'module.application.google_artifact_registry_repository.docker', 'Unexpected resource'
              assert r['change']['actions'] in [['create'], ['no-op']], 'Unexpected mutation; review privately'
              after = r['change']['after']
              assert after['project'] == 'ritru-fc-dev-01', 'Unexpected project'
              assert after['location'] == 'asia-south1', 'Unexpected region'
              assert after['repository_id'] == 'flashcart-docker', 'Unexpected repository'
              assert after['format'] == 'DOCKER', 'Unexpected repository format'
              assert after['docker_config'][0]['immutable_tags'] is True, 'Immutable tags required'
          counts = Counter(','.join(r['change']['actions']) for r in changes)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('### FlashCart Artifact Registry dev plan\n\n')
              out.write('Target: `ritru-fc-dev-01`, `asia-south1`, `flashcart-docker` (DOCKER, immutable tags).\n\n')
              for action, count in sorted(counts.items()):
                  out.write(f'- {action}: {count}\n')
              out.write('\nNo apply job exists. Review the plan privately before authorizing any deployment.\n')
          PY

      - name: Remove local plan files
        if: always()
        run: rm -f "$STACK/tfplan" "$STACK/plan.txt" "$STACK/plan.json"
